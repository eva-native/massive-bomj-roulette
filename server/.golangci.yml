version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
  settings:
    errcheck:
      # Close errors in defer are not actionable.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
