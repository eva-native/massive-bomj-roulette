# Local development:   docker compose up -d db
# Full app locally:    docker compose -f compose.yaml -f compose.build.yaml --profile app up --build
# Production:          the released image from GHCR, see docs/dev/deploy.md
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mbr
      POSTGRES_PASSWORD: mbr
      POSTGRES_DB: mbr
    # 5433 on the host so it does not clash with a locally installed PostgreSQL;
    # bound to localhost only, so the database is never reachable from outside.
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbr"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [app]
    # The published release MBR_VERSION (v0.3.0). The same path is in
    # .github/workflows/release.yml. Building from source: compose.build.yaml.
    image: ghcr.io/eva-native/massive-bomj-roulette:${MBR_VERSION:-latest}
    env_file: .env
    environment:
      MBR_DATABASE_URL: postgres://mbr:mbr@db:5432/mbr?sslmode=disable
      # Inside the container; the address on the host is MBR_HOST_PORT.
      MBR_ADDR: ":8080"
    # Behind your own proxy: MBR_HOST_PORT=127.0.0.1:8001 in .env.
    ports: ["${MBR_HOST_PORT:-8080}:8080"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: [prod]
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      MBR_DOMAIN: ${MBR_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
