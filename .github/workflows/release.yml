# Publishes the Docker image of a release to GHCR (see docs/dev/deploy.md).
# Image tags follow the git tag: v0.3.0 → v0.3.0, v0.3 and latest. v0.3 and
# latest go only to the newest stable version (of its line, of all).
name: Release image

on:
  push:
    tags: ["v*"]
  # Publish an existing tag again, e.g. one released before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, e.g. v0.2.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # The same path is in compose.yaml; change both together.
  IMAGE: ghcr.io/eva-native/massive-bomj-roulette

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      latest: ${{ steps.check.outputs.latest }}
      minor: ${{ steps.check.outputs.minor }}
    steps:
      - name: Tag is a release version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      # A stable release must be on main. latest and vX.Y move only to the newest
      # version (of all, of its X.Y line), so a hotfix of an older line or a
      # re-publish never moves them back.
      - id: check
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "minor=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          newest() { git tag -l "$1" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1; }
          all=$(newest 'v*')
          line=$(newest "${TAG%.*}.*")
          echo "latest=$([[ "$TAG" == "$all" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "minor=$([[ "$TAG" == "$line" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "newest: $all, newest of ${TAG%.*}: $line"

  # The full CI on the tagged commit: nothing red gets published.
  ci:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  image:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # GitHub records the run's commit in provenance. A manual run starts from a
    # branch, not from the tag, so its images get no provenance rather than a wrong one.
    env:
      PROVENANCE: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases (v0.3.0-rc.1) get only their own tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.TAG }},enable=${{ needs.check.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: MBR_VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.PROVENANCE }}

      - if: env.PROVENANCE == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
